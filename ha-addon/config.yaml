name: "Wall Kiosk"
description: "Solar-aware tablet dashboard for Maui home."
version: "1.0.69"
slug: "wall_kiosk"
startup: application
boot: auto
init: false
arch:
  - aarch64
  - amd64
image: "ghcr.io/tgonser/maui_home_assistant/wall-kiosk"
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
ingress_entry: /
# Publish the general kiosk on the host network so wall tablets on the SAME
# local network can open it chrome-free. Consequential storm-prep actions are
# disabled on this plain-HTTP endpoint; use secure Home Assistant ingress/HTTPS
# to unlock them. The direct endpoint is not reachable through Nabu Casa.
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": "Direct LAN kiosk (storm-prep actions require secure HA ingress/HTTPS)"
panel_icon: mdi:tablet-dashboard
panel_title: Wall
options:
  storm_prep_pin: ""
schema:
  storm_prep_pin: password
