# =============================================================================
# Maui Wake-up (one alarm per suite: Beach, Boardroom, Molokini, Mauka guest suites
# and the owners' Master suite) — managed by the Wall Kiosk
# =============================================================================
# The guest tablet in a suite sets these helpers; at the wake time this
# package fades up THAT suite's bedroom lights, opens its bedroom shades and
# (where the suite has a speaker) plays a Spotify playlist quiet → louder, or
# says good morning every 2 minutes, up to 3 times. Snooze dims the lights, stops the voice and rings again in 9 min.
# "I'm up" stops everything. Nothing outside the suite is touched.
# Repeat: "Once" turns itself off after ringing; "Every day until I leave"
# rings each day through the leave date, then turns itself off.
# Ringing ends by itself after 20 minutes.
# =============================================================================


