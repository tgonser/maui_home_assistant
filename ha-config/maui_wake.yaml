automation maui_wake:
  - id: maui_wake_beach
    alias: "Maui Wake-up — Beach"
    description: "Guest wake-up for the Beach suite only. Set from the guest tablet."
    mode: restart
    triggers:
      - trigger: time
        at: input_datetime.wake_beach_time
        id: time
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.wake_beach_snooze
        id: snooze
    conditions:
      # A snooze re-ring still happens after a one-time alarm switched itself off.
      - condition: template
        value_template: "{{ trigger.id == 'snooze' or is_state('input_boolean.wake_beach_enabled', 'on') }}"
      - condition: template
        value_template: >-
          {{ trigger.id == 'snooze'
             or is_state('input_select.wake_beach_repeat', 'Once')
             or states('input_datetime.wake_beach_until') in ['unknown', 'unavailable', '']
             or now().date() | string <= states('input_datetime.wake_beach_until') }}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wake_beach_ringing
      - if:
          - condition: state
            entity_id: input_boolean.wake_beach_lights
            state: "on"
        then:
          - action: light.turn_on
            target:
              entity_id: "{{ states.light | selectattr('entity_id', 'match', 'light\\.floor_1_bedroom_2_suite_bed_2_') | rejectattr('entity_id', 'search', '_bath_|closet') | rejectattr('state', 'eq', 'unavailable') | map(attribute='entity_id') | list }}"
            data:
              brightness_pct: 70
              transition: 120
            continue_on_error: true
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'time' and is_state('input_boolean.wake_beach_shades', 'on') }}"
        then:
          - action: cover.open_cover
            target:
              entity_id:
                - cover.floor_1_bedroom_2_suite_bed_2_shade_group_1
            continue_on_error: true
      # One-time alarms switch themselves off; daily ones stop after the last day.
      - if:
          - condition: template
            value_template: >-
              {{ trigger.id == 'time' and (is_state('input_select.wake_beach_repeat', 'Once')
                 or now().date() | string >= states('input_datetime.wake_beach_until')) }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.wake_beach_enabled
      # Music (a Spotify playlist on the bedroom Bluesound, quiet → louder over
      # ~5 min) when Spotify can see the speaker and isn't already playing
      # somewhere else; otherwise the good-morning voice.
      - variables:
          music_ok: >-
            {{ is_state('input_boolean.wake_beach_music', 'on')
               and states('input_text.wake_beach_playlist') is match('spotify:')
               and 'Beach Guest Bed' in (state_attr('media_player.spotify_gonzomatic', 'source_list') or [])
               and not is_state('media_player.spotify_gonzomatic', 'playing') }}
      - if:
          - condition: template
            value_template: "{{ music_ok }}"
        then:
          # Good morning once (voice first — speaking over Spotify would cut it off), then music.
          - if:
              - condition: state
                entity_id: input_boolean.wake_beach_voice
                state: "on"
            then:
              - action: media_player.volume_set
                target:
                  entity_id: media_player.beach_guest_bed
                data:
                  volume_level: 0.2
                continue_on_error: true
              - action: tts.speak
                target:
                  entity_id: tts.home_assistant_cloud
                data:
                  media_player_entity_id: media_player.beach_guest_bed
                  message: "Good morning. It's {{ now().strftime('%-I:%M') }}. Time to wake up."
                continue_on_error: true
              - delay: "00:00:08"
          - action: media_player.volume_set
            target:
              entity_id: media_player.beach_guest_bed
            data:
              volume_level: 0.04
            continue_on_error: true
          - action: media_player.select_source
            target:
              entity_id: media_player.spotify_gonzomatic
            data:
              source: "Beach Guest Bed"
            continue_on_error: true
          - delay: "00:00:03"
          - action: media_player.play_media
            target:
              entity_id: media_player.spotify_gonzomatic
            data:
              media_content_id: "{{ states('input_text.wake_beach_playlist') }}"
              media_content_type: playlist
            continue_on_error: true
          - action: media_player.shuffle_set
            target:
              entity_id: media_player.spotify_gonzomatic
            data:
              shuffle: true
            continue_on_error: true
          - repeat:
              count: 12
              sequence:
                - delay: "00:00:25"
                - condition: state
                  entity_id: input_boolean.wake_beach_ringing
                  state: "on"
                - action: media_player.volume_set
                  target:
                    entity_id: media_player.beach_guest_bed
                  data:
                    volume_level: "{{ [0.04 + 0.025 * repeat.index, 0.32] | min }}"
                  continue_on_error: true
      - if:
          - condition: template
            value_template: >-
              {{ not music_ok and (is_state('input_boolean.wake_beach_voice', 'on')
                 or is_state('input_boolean.wake_beach_music', 'on')) }}
        then:
          - action: media_player.volume_set
            target:
              entity_id: media_player.beach_guest_bed
            data:
              volume_level: 0.25
            continue_on_error: true
          - repeat:
              count: 3
              sequence:
                - condition: state
                  entity_id: input_boolean.wake_beach_ringing
                  state: "on"
                - action: tts.speak
                  target:
                    entity_id: tts.home_assistant_cloud
                  data:
                    media_player_entity_id: media_player.beach_guest_bed
                    message: "Good morning. It's {{ now().strftime('%-I:%M') }}. Time to wake up."
                  continue_on_error: true
                - delay: "00:02:00"
      - wait_template: "{{ is_state('input_boolean.wake_beach_ringing', 'off') }}"
        timeout: "00:20:00"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.wake_beach_ringing
